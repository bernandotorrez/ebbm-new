services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebmp_app
    restart: unless-stopped
    networks:
      - ebmp_network
    expose:
      - "9000"
    environment:
      - APP_ENV=production
    volumes:
      - .env:/var/www/html/.env:rw
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: ebmp_nginx
    restart: unless-stopped
    networks:
      - ebmp_network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/ssl/BasarnasSSL:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app

  mysql:
    image: percona:8.0
    container_name: ebmp_mysql
    restart: unless-stopped
    networks:
      - ebmp_network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ebmp
      MYSQL_USER: ebmp_user
      MYSQL_PASSWORD: ebmp_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

networks:
  ebmp_network:
    driver: bridge

volumes:
  mysql_data:
  nginx_logs: