services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebbl_app
    restart: unless-stopped
    networks:
      - ebbl_network
    environment:
      - APP_ENV=production
    volumes:
      - .env:/var/www/html/.env:rw
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: ebbl_nginx
    restart: unless-stopped
    networks:
      - ebbl_network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/ssl/BasarnasSSL:ro
      - app_public:/var/www/html/public:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app

  mysql:
    image: percona:8.0
    container_name: ebbl_mysql
    restart: unless-stopped
    networks:
      - ebbl_network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ebbm
      MYSQL_USER: ebbm_user
      MYSQL_PASSWORD: ebbm_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

networks:
  ebbl_network:
    driver: bridge

volumes:
  mysql_data:
  app_storage:
  app_public:
  nginx_logs: